# =====================================================================
# RoboTwin 机器人配置(robot config)
# 作用:把 LeRobot 数据集里的"原始字段名/切片"映射到 LingBot-VLA 2.0 的
#       统一特征空间(arm.position / effector.position / 相机名)。
# 文件名去掉 .yaml 后即为 data.data_name(此处 = robotwin)。
# 约束:这里出现的 joint type 与 camera 名,必须已在 VLA 训练配置的
#       data.joints 与 data.cameras 中声明,否则运行时报 ValueError。
# =====================================================================

# ---- states:把原始 observation 映射到统一"状态"特征(模型输入的当前状态)----
states:
  - observation.state.arm.position:          # 统一状态特征:臂关节位置(须在 data.joints 声明 arm.position)
      origin_keys:                           # 来自哪些原始张量(可多个,按顺序拼接成统一特征)
        - observation.state:                 # 左臂关节 [0:6),共 6 维
            start: 0                         # 切片起点(闭区间,包含该索引)
            end: 6                           # 切片终点(开区间,不含该索引,即取到索引 5)
        - observation.state:                 # 右臂关节 [7:13),共 6 维(跳过索引 6 = 左夹爪)
            start: 7
            end: 13

  - observation.state.effector.position:     # 统一状态特征:夹爪位置(须在 data.joints 声明 effector.position)
      origin_keys:
        - observation.state:                 # 左夹爪 [6:7),1 维
            start: 6
            end: 7
        - observation.state:                 # 右夹爪 [13:14),1 维
            start: 13
            end: 14

# ---- actions:把原始 action 映射到统一"动作"目标(模型要预测的动作)----
actions:
  - action.arm.position:                     # 统一动作特征:臂关节位置目标
      origin_keys:
          - action:                          # 左臂动作 [0:6)
              start: 0
              end: 6
          - action:                          # 右臂动作 [7:13)
              start: 7
              end: 13
      subtract_state: False                  # 是否学相对动作:True=目标减当前状态(学增量 delta);False=学绝对动作。RoboTwin 用 False;真机建议 arm 改 True

  - action.effector.position:                # 统一动作特征:夹爪位置目标
      origin_keys:
          - action:                          # 左夹爪动作 [6:7)
              start: 6
              end: 7
          - action:                          # 右夹爪动作 [13:14)
              start: 13
              end: 14
      subtract_state: False                  # 夹爪:RoboTwin 与真机都建议 False(学绝对开合量)

# ---- images:把原始相机键重命名为统一相机名(须在 data.cameras 声明)----
images:
  - observation.images.camera_top:           # 统一相机名:顶部/第三视角相机
      origin_keys: observation.images.cam_high        # 原始数据里的相机键名(RoboTwin 原名为 cam_high)
  - observation.images.camera_wrist_left:    # 统一相机名:左腕相机
      origin_keys: observation.images.cam_left_wrist
  - observation.images.camera_wrist_right:   # 统一相机名:右腕相机
      origin_keys: observation.images.cam_right_wrist

# ---- 归一化统计文件:由 scripts/compute_norm_stats.py 生成 ----
norm_stats: assets/norm_stats/robotwin.json  # 训练时从此路径读取各特征的归一化统计量(均值/方差/边界等);重新计算后须指向生成的 JSON
